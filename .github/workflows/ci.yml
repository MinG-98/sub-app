name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: black --check
        run: black --check .

      - name: Compile check
        run: python -m compileall -q app scripts agent/node-agent.py agent/tests tests

      - name: pytest
        run: pytest -q
