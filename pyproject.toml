[tool.black]
target-version = ["py310"]
line-length = 88

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Line length is left to black; black does not wrap long strings/URLs/comments,
# so enforcing E501 alongside it fights the formatter instead of the author.
ignore = ["E501"]
